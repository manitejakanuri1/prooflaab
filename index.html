<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <script>
      // Dark is the product's design, so it is the default for anyone who has
      // not chosen. Set before first paint, or the page flashes light and then
      // snaps dark on every load. A saved choice always wins.
      (function() {
        var theme = localStorage.getItem('theme');
        var next = theme === 'light' ? 'light' : 'dark';
        document.documentElement.classList.remove('light', 'dark');
        document.documentElement.classList.add(next);
        if (!theme) localStorage.setItem('theme', 'dark');
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProofLabAI – Verified Student Projects & Portfolios</title>
    <meta name="description" content="Showcase your verified projects and build a trusted portfolio with ProofLabAI. Get your work validated and recognized." />
    <meta name="author" content="ProofLabAI" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://prooflab.ai" />

    <!-- OpenGraph Meta Tags -->
    <meta property="og:title" content="ProofLabAI – Verified Student Projects & Portfolios" />
    <meta property="og:description" content="Showcase your verified projects and build a trusted portfolio with ProofLabAI. Get your work validated and recognized." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://prooflab.ai" />
    <meta property="og:image" content="https://prooflab.ai/og-default.png" />
    <meta property="og:site_name" content="ProofLabAI" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@ProofLabAI" />
    <meta name="twitter:title" content="ProofLabAI – Verified Student Projects & Portfolios" />
    <meta name="twitter:description" content="Showcase your verified projects and build a trusted portfolio with ProofLabAI." />
    <meta name="twitter:image" content="https://prooflab.ai/og-default.png" />

    <!-- Favicon and Apple Touch Icon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.ico" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#12151a" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
