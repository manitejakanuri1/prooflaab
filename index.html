<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <script>
      // Dark is the product's design, so it is the default for anyone who has
      // not chosen. Set before first paint, or the page flashes light and then
      // snaps dark on every load. A saved choice always wins.
      (function() {
        var theme = localStorage.getItem('theme');
        var next = theme === 'light' ? 'light' : 'dark';
        document.documentElement.classList.remove('light', 'dark');
        document.documentElement.classList.add(next);
        if (!theme) localStorage.setItem('theme', 'dark');
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prooflab — Build Proof. Show Readiness.</title>
    <meta name="description" content="Build real proof of your skills through practical challenges. Colleges see progress, and recruiters see the evidence behind every resume." />
    <meta name="author" content="ProofLab" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://prooflab.ai" />

    <!-- OpenGraph Meta Tags -->
    <meta property="og:title" content="Prooflab — Build Proof. Show Readiness." />
    <meta property="og:description" content="Build real proof of your skills through practical challenges. Colleges see progress, and recruiters see the evidence behind every resume." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://prooflab.ai" />
    <meta property="og:image" content="https://prooflab.ai/og-default.png" />
    <meta property="og:site_name" content="ProofLab" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@ProofLabAI" />
    <meta name="twitter:title" content="Prooflab — Build Proof. Show Readiness." />
    <meta name="twitter:description" content="Build real proof of your skills through practical challenges. Colleges see progress, and recruiters see the evidence behind every resume." />
    <meta name="twitter:image" content="https://prooflab.ai/og-default.png" />

    <!-- Favicon and Apple Touch Icon: the brand-kit icon in the public logo bucket -->
