name: Crawl source content

# The collector only fetches the seed_urls listed in source_registry - it does
# not follow links - so once it has consumed that list every later run is mostly
# duplicate detection. That is fine and cheap: the point of running it on a
# schedule is to pick up pages that CHANGED, and to fetch seeds added to the
# registry since the last run, without anyone remembering to do it by hand.
#
# Needs two repository secrets:
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY   <- bypasses RLS; the crawler writes source_content
#
# The service-role key is powerful. It lives in GitHub's encrypted secrets and is
# never printed - the crawler reads it from the environment and GitHub masks it
# in logs. If that is not acceptable, run crawler/crawl.py locally instead and
# leave this workflow disabled.

on:
  schedule:
    # 02:40 UTC every Sunday. The collector only fetches the literal
    # seed_urls in source_registry, no recursive spidering (see the comment
    # above), so a daily run bought nothing over weekly - same URLs, same
    # duplicate-detection result, every day. Weekly still catches changed
    # pages and any seed added to the registry since the last run.
    # Deliberately not on the hour: scheduled jobs pile up at :00 across all
    # of GitHub and get delayed, and nothing here is time-critical.
    - cron: '40 2 * * 0'
  workflow_dispatch:

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # Politeness delays are per source and per URL, so this is mostly waiting.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install crawler dependencies
        working-directory: crawler
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crawl
        working-directory: crawler
        env:
          # The collected material has to land where the live site reads it, which
          # is Cloud SQL through PostgREST. Writing to Supabase would have failed
          # in the worst way: every run reporting success while students saw no
          # new material.
          BACKEND: google
          POSTGREST_URL: https://prooflab-api-ysn2mpe6sa-el.a.run.app
          PGRST_JWT_SECRET: ${{ secrets.PGRST_JWT_SECRET }}
          # Optional. Only lifts GitHub's hourly rate limit; public readmes are
          # readable without it.
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
        run: |
          if [ -z "$PGRST_JWT_SECRET" ]; then
            echo "::error::PGRST_JWT_SECRET is not set. Add it under Settings -> Secrets and variables -> Actions. Its value is the Google secret prooflab-jwt-secret."
            exit 1
          fi
          # Each URL prints its own outcome (inserted / updated / unchanged /
          # near_duplicate / blocked_by_robots / fetch_failed / too_short), so the
          # run log is the report. "unchanged" is the expected steady state: a
          # page already stored, re-read, and found not to have moved.
          python crawl.py
