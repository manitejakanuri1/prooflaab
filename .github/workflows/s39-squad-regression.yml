name: Squad vacancy filling (migrations 108-109) and college UI freeze

# Sidhu S39. Proves, in the cloud:
#   1. the screens are frozen: nothing under src/ differs from S38 74c3a12 (TEJA 7704a98 + the reviewed S38 delete-dialog wording), and the named college controls exist;
#   2. migration 108 (squads below eleven are filled from the reserve) and 109 (the import Branch list) on PGlite;
#   3. the same under real concurrency, with several sessions on a real PostgreSQL 16 server;
#   4. the earlier 105-107 suites still pass on the same schema slice.
# A skipped test fails this gate.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  squads:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the freeze check compares with 74c3a12

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Owner decision 13 Oct: the admin panel may change (People menu merge, bulk remove, confirm box, live
      # numbers, side-panel toggle). Student and college screens stay frozen. removeStudents.ts is shared with
      # the college page; its 13 Oct change only adds the "kept locked test accounts" count.
      # 14 Oct: permit reset starter code button in student sandbox and timed resume assessment.
      # 15 Oct: permit resume onboarding fixes (validation, reload recovery, ATS gate, text labels).
      # 16 Oct: interest picker drops the 5 interests the server never supported (Prompt Engineering, aptitude, HR).
      # 16 Oct: skill + career goal required; goal must match the picks; no dashboard exit from the review error.
      # 16 Oct: full-screen split task screens (question left, answer right) and voice recording beside them.
      # 17 Oct: the voice recorder sits beside the answer (TaskVoicePanel), locked until the answer passes.
      # 19 Oct: owner decision - the college student profile shows the seven onboarding steps (migration 121);
      #         the admin Students screen opens the same profile.
      # 19 Oct: owner decision - the student Squad page says when the season is over (champion, final rank).
      # 19 Oct: owner decision - Squad tabs: section + college rank, role "Member", last season's final
      #         leaderboard (migration 124), season report wording.
      # 19 Oct: owner decision - a task question shows any exact rule the simple version dropped.
      # 22 Oct: owner decision - the coding score shows each question's tests (migration 128), and the
      #         voice recorder's tip says: explain it like you are talking to a friend.
      # 22 Oct: owner decision - Sunday is the Lot rest day; the daily card says so (migration 130).
      # 22 Oct: owner decision - when every roadmap task is done, the task list shows the "Boss level" next step.
      # 23 Oct: owner decision - roadmap items use the task list's own words (Start Task, Write my answer,
      #         Solve in editor, View Submission; Not started / In Progress / Completed).
      # 23 Oct: owner decision - Share Portfolio works: says when the portfolio is private, shows the link if copy fails.
      # 23 Oct: owner decision - Badges and quests come from real activity (migration 135); quests show no XP promise.
      # 23 Oct: owner decision - voice privacy texts match the real rules (mock audio is never shared; task audio
      #         reaches companies only with the student's audio-sharing switch on).
      # 23 Oct: owner decision - students cannot delete recordings or their account (migration 138); Privacy has
      #         no delete button, Settings has no Delete Account box; older audio (beyond the newest 7) shows
      #         "audio removed to save space" with the words still there.
      # 23 Oct: owner decision - a company sees daily Lots only (migration 139), worded "Daily Lots and spoken
      #         explanations" / "Lots solved" / "Passed · 100/100" / "Feedback:".
      # 24 Oct: owner decision - mock interview audio joins the newest-7 rule (migration 141); the recording notices
      #         say so in plain words and that score, feedback and written words always stay in the history.
      # 24 Oct: owner decision - after Auto-fix one button "Download & continue with this resume" switches to the new
      #         resume (migration 142), shows old -> new scores and what the AI changed; every resume score has a
      #         "How is this scored?" panel (ScoreExplainer) with the rules, marks per question and the formula.
      # 24 Oct: owner decision - each question in the result and history shows its marks on top (QuestionMarks):
      #         MCQ 100/0 -> Skill proof; written: correct -> Skill/Project proof, clear -> Reasoning.
      # 25 Oct: owner decision - squad swaps (migration 143): two students in the same section trade squads in the
      #         first 7 days with each other's squad code; own points move with them. Student Squad page gets the swap
      #         box (SquadSwapCard), the college Squads page a Swaps tab (SquadSwapsList, shared with the admin).
      # 25 Oct: owner decision - the home page is the prooflab-ai.lovable.app design (src/components/landing);
      #   only the look and words changed, every sign-in button still goes to /auth.
      # 25 Oct: owner decision - brand-kit logo (public bucket gs://prooflab_logo/brand) on every page, tab icon and
      #   title, logo on the sign-in and set-password pages; the name "ProofLabAI" is written "ProofLab".
      # 25 Oct: owner decision - sign-in and set-password pages use Lovable's /login design (always dark) with the
      #   12 polish items; the sign-in itself is unchanged; no "Request access" link.
      # 25 Oct: owner decision - student start onboarding (welcome, resume choice, interests, interest review) in the
      #   same dark brand frame as sign-in; look only, no wording or flow change.
      # 25 Oct: owner decision - resume onboarding page (resume check, confirm, scorecard) in the same frame; the
      #   resume check and skill gap only gain dark-mode colour variants. Look only.
      # 25 Oct: owner decision - pop-ups and drop-down lists opened inside the brand frame (the question round,
      #   target role list) take the dark brand look (src/lib/brandScope.ts); everywhere else they are unchanged.
      # 25 Oct: owner decision - the spinning loading circle (every page) and the chat button in the corner are
      #   brand blue #51A6FB instead of yellow. Colour only.
      # 25 Oct: owner decision - student dashboard part 1: the frame (top bar, left menu, background) takes the
      #   brand colours and fonts and follows the light/dark switch; its pop-ups match. Look only.
      # 25 Oct: owner decision - student dashboard part 2: the Floor (today's card, task list, task screens) uses
      #   brand colours only (scripts/dev-tools/brand_colours.py). Look only.
      # 25 Oct: owner decision - student dashboard part 3: the Build-log (recent work, progress charts, skills
      #   evidence, history) in brand colours; the open tab is brand blue. Look only.
      # 25 Oct: owner decision - student dashboard part 4: Squad (overview, season report, swap box) in brand
      #   colours. Look only.
      # 26 Oct: owner decision - student dashboard part 5: Profile (all ten tabs, roadmap and lessons, resume
      #   check) in brand colours. Look only.
      # 26 Oct: owner decision - the public portfolio page and the interest onboarding page use the brand look
      #   (BrandPage / BrandFrame in AccessShell). Look only.
      # 26 Oct: owner decision - college dashboard part 1: frame (brand page, header, side menu) in brand
      #   colours. Look only.
      # 26 Oct: owner decision - college dashboard part 2: Home and Students (list, profile, import,
      #   notifications) in brand colours. Look only.
      # 26 Oct: owner decision - college dashboard part 3: Squads (standings, members, manage) in brand
      #   colours. Look only.
      # 26 Oct: owner decision - college dashboard part 4: Insights, college profile and settings in brand
      #   colours. Look only.
      # 26 Oct: owner decision - college dashboard part 5: college sign-up steps in the always-dark brand
      #   frame (BrandFrame). Look only.
      # 26 Oct: owner decision - the student landing screen is called "ProofLab" instead of "Floor" (menu,
      #   daily card heading, Build-log empty text, welcome screen). Wording only, owner's request.
      # 26 Oct: owner decision - company (recruiter) dashboard part 1: frame (brand page, header, side menu,
      #   verification banner) in brand colours. Look only.
      # 26 Oct: owner decision - company dashboard parts 2-4: Home, Talent, Lots, Hiring, Settings in brand
      #   colours; company sign-up steps in the always-dark brand frame (BrandFrame). Look only.
      # 27 Oct: owner decision - TEST website 5-minute season week: squad and swap screens show times
      #   (src/lib/testClock.ts, on only when VITE_TEST_FAST_WEEK=true in the TEST build). REAL build unchanged.
      # 27 Oct: owner decision - dead "proof verified" scoring removed (migration 150): its labels leave the student
      #   history (StudentHistory), season report and college student profile; the college Squads empty state shows
      #   Form squads and Create squad (TpoSquads) so a new college can make its first squad.
      # 28 Oct: owner decision - season fixes MF-003/008/009: one season status (SeasonPhaseBar: Season complete card
      #   with champion, podium and next-season line), standings with one rank, a Section column, W-D-L key and
      #   tie note, "No activity yet" / "won as higher seed" results (TpoHome, TpoSquads, StudentSquadPage).
      # 29 Oct: owner decision - graded daily marks (migration 165): Check / Submit this score on Daily Lot task
      #   screens (SandboxTaskPanel, WrittenTaskPanel), voice record-again and skip warning (TaskVoicePanel,
      #   VoiceExplainModal), today's marks and week total (StudentDailyCard), squad week marks (StudentSquadPage),
      #   college marks explanation (TpoSquads); new src/lib/lotMarks*.ts. Re-frozen by the step below.
      # 30 Oct: owner decision - MF-011, Assign lists only the student's own section (TpoSquads); new
      #   src/lib/squadSection*.ts. Re-frozen by the step below.
      # 30 Oct: owner decision - MF-020, a finished task shows the saved answer and result (SandboxTaskPanel,
      #   WrittenTaskPanel); new src/lib/savedAnswer*.ts. Re-frozen by the step below.
