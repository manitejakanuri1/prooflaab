name: Deploy to production

# Publishes the site to Firebase Hosting, in the same Google project as the
# database, the API, the file service and the 40 functions. It replaces a
# workflow that promoted a build on Vercel - which is why, for a while after the
# move, every push kept refreshing the old site while the new one sat still.
#
# No key file. GitHub proves who it is with a short-lived OIDC token, Google
# accepts it only from this repository, and hands back a credential that expires
# in minutes. There is no secret to leak and none to rotate. The one thing that
# would grant standing access to the project - a downloaded service-account key -
# deliberately does not exist.
#
# The account it acts as may publish to Hosting and do nothing else.

# Every push (any branch) and pull request runs the release gate. Only a push to
# main that passes the gate publishes; a failing test means no deploy.
on:
  push:
  pull_request:
  # Lets you re-run a deploy from the Actions tab without pushing anything.
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run pointless, so cancel it
# rather than racing two publishes at the same site.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write        # required to request the OIDC token

jobs:
  # Release gate. Must pass before anything is published.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'     # the unit tests are .ts files run by node --test
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install
        run: npm ci

      - name: Frontend unit tests
        run: node --experimental-strip-types --test src/lib/*.test.ts

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Server function tests (Deno)
        run: deno test --no-lock --allow-env --allow-import --allow-read supabase/functions/_shared/ supabase/functions/transcription-reap/

      - name: Production build
        run: npm run build

  deploy:
    needs: test
    # Publishing only ever happens from main (or a manual run of main), never from
    # another branch or a pull request.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: prooflab-508214
          workload_identity_provider: projects/135298577404/locations/global/workloadIdentityPools/github/providers/prooflaab
          service_account: github-deploy@prooflab-508214.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build
        run: |
          npm ci
          # .env.production is committed, so the addresses this build talks to
          # are visible in the diff that ships it rather than hidden in a
          # dashboard where a change leaves no trace.
          npm run build

      - name: Publish
        run: python scripts/deploy-hosting.py

      - name: Confirm the site is serving the new build
        run: |
          # A publish can report success while the edge still serves the previous
          # version, so check the bundle name actually moved rather than trusting
          # the API's word for it.
          # The entry is the <script type="module" src=...> in index.html. Other
          # chunks can also be named index-*.js, so never pick one by filename.
          entry() { grep -oE '<script type="module"[^>]*src="/assets/[^"]+\.js"' | grep -oE 'assets/[^"]+\.js' | head -1; }
          built=$(entry < dist/index.html)
          echo "expecting: $built"
          for i in $(seq 1 20); do
            live=$(curl -s -H 'Cache-Control: no-cache' https://prooflab.co.in/ | entry || true)
            if [ -n "$built" ] && [ "$live" = "$built" ]; then
              echo "live and serving $live"
              exit 0
            fi
            sleep 6
          done
          echo "::warning::prooflab.co.in is still serving $live, not $built. It may catch up shortly."
