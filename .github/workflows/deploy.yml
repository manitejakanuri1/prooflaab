name: Deploy to production

# Publishes the site to Firebase Hosting, in the same Google project as the
# database, the API, the file service and the 41 functions. It replaces a
# workflow that promoted a build on Vercel - which is why, for a while after the
# move, every push kept refreshing the old site while the new one sat still.
#
# No key file. GitHub proves who it is with a short-lived OIDC token, Google
# accepts it only from this repository, and hands back a credential that expires
# in minutes. There is no secret to leak and none to rotate. The one thing that
# would grant standing access to the project - a downloaded service-account key -
# deliberately does not exist.
#
# The account it acts as may publish to Hosting and do nothing else.

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without pushing anything.
  workflow_dispatch:

# A newer push makes an in-flight deploy pointless, so cancel it rather than
# racing two publishes at the same site.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write        # required to request the OIDC token

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: prooflab-508214
          workload_identity_provider: projects/135298577404/locations/global/workloadIdentityPools/github/providers/prooflaab
          service_account: github-deploy@prooflab-508214.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build
        run: |
          npm ci
          # .env.production is committed, so the addresses this build talks to
          # are visible in the diff that ships it rather than hidden in a
          # dashboard where a change leaves no trace.
          npm run build

      - name: Publish
        run: python scripts/deploy-hosting.py

      - name: Confirm the site is serving the new build
        run: |
          # A publish can report success while the edge still serves the previous
          # version, so check the bundle name actually moved rather than trusting
          # the API's word for it.
          built=$(ls dist/assets/index-*.js | head -1 | xargs basename)
          echo "expecting: $built"
          for i in $(seq 1 20); do
            live=$(curl -s https://prooflab.co.in/ | grep -oE 'assets/index-[^"]+\.js' | head -1 || true)
            if [ "$(basename "$live")" = "$built" ]; then
              echo "live and serving $live"
              exit 0
            fi
            sleep 6
          done
          echo "::warning::prooflab.co.in is still serving $live, not $built. It may catch up shortly."
