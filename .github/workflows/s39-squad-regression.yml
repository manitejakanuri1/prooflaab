name: Squad vacancy filling (migrations 108-109) and college UI freeze

# Sidhu S39. Proves, in the cloud:
#   1. the screens are frozen: nothing under src/ differs from S38 74c3a12 (TEJA 7704a98 + the reviewed S38 delete-dialog wording), and the named college controls exist;
#   2. migration 108 (squads below eleven are filled from the reserve) and 109 (the import Branch list) on PGlite;
#   3. the same under real concurrency, with several sessions on a real PostgreSQL 16 server;
#   4. the earlier 105-107 suites still pass on the same schema slice.
# A skipped test fails this gate.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  squads:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the freeze check compares with 74c3a12

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Owner decision 13 Oct: the admin panel may change (People menu merge, bulk remove, confirm box, live
      # numbers, side-panel toggle). Student and college screens stay frozen. removeStudents.ts is shared with
      # the college page; its 13 Oct change only adds the "kept locked test accounts" count.
      # 14 Oct: permit reset starter code button in student sandbox and timed resume assessment.
      # 15 Oct: permit resume onboarding fixes (validation, reload recovery, ATS gate, text labels).
      # 16 Oct: interest picker drops the 5 interests the server never supported (Prompt Engineering, aptitude, HR).
      # 16 Oct: skill + career goal required; goal must match the picks; no dashboard exit from the review error.
      # 16 Oct: full-screen split task screens (question left, answer right) and voice recording beside them.
      # 17 Oct: the voice recorder sits beside the answer (TaskVoicePanel), locked until the answer passes.
      # 19 Oct: owner decision - the college student profile shows the seven onboarding steps (migration 121);
      #         the admin Students screen opens the same profile.
      # 19 Oct: owner decision - the student Squad page says when the season is over (champion, final rank).
      # 19 Oct: owner decision - Squad tabs: section + college rank, role "Member", last season's final
      #         leaderboard (migration 124), season report wording.
      # 19 Oct: owner decision - a task question shows any exact rule the simple version dropped.
      # 22 Oct: owner decision - the coding score shows each question's tests (migration 128), and the
      #         voice recorder's tip says: explain it like you are talking to a friend.
      # 22 Oct: owner decision - Sunday is the Lot rest day; the daily card says so (migration 130).
      # 22 Oct: owner decision - when every roadmap task is done, the task list shows the "Boss level" next step.
      # 23 Oct: owner decision - roadmap items use the task list's own words (Start Task, Write my answer,
      #         Solve in editor, View Submission; Not started / In Progress / Completed).
      # 23 Oct: owner decision - Share Portfolio works: says when the portfolio is private, shows the link if copy fails.
      # 23 Oct: owner decision - Badges and quests come from real activity (migration 135); quests show no XP promise.
      # 23 Oct: owner decision - voice privacy texts match the real rules (mock audio is never shared; task audio
      #         reaches companies only with the student's audio-sharing switch on).
      - name: UI freeze - no student/college screen file changed since S38 74c3a12 (admin panel excepted)
        run: |
          ALLOWED=(':(exclude)src/components/dashboard/admin' ':(exclude)src/pages/AdminDashboard.tsx'
                   ':(exclude)src/hooks/useConfirm.tsx' ':(exclude)src/lib/removeStudents.ts'
                   ':(exclude)src/components/dashboard/student/SandboxTaskPanel.tsx'
                   ':(exclude)src/components/dashboard/student/TimedResumeAssessment.tsx'
                   ':(exclude)src/components/dashboard/student/ResumeCheckFlow.tsx'
                   ':(exclude)src/components/dashboard/student/CodingBreakdown.tsx'
                   ':(exclude)src/components/dashboard/student/StudentResumeHistoryPage.tsx'
                   ':(exclude)src/components/dashboard/student/TestMistakes.tsx'
                   ':(exclude)src/components/dashboard/student/StudentRoadmapPage.tsx'
                   ':(exclude)src/components/dashboard/student/StudentPortfolioPage.tsx'
                   ':(exclude)src/components/dashboard/student/StudentAchievements.tsx'
                   ':(exclude)src/components/dashboard/student/MockInterview.tsx'
                   ':(exclude)src/components/onboarding/IntakeChoice.tsx'
                   ':(exclude)src/hooks/useStudentIntake.tsx'
                   ':(exclude)src/pages/StudentStart.tsx'
                   ':(exclude)src/components/onboarding/StudentWizard.tsx'
                   ':(exclude)src/components/onboarding/InterestReview.tsx'
                   ':(exclude)src/components/dashboard/student/WrittenTaskPanel.tsx'
                   ':(exclude)src/components/dashboard/student/StudentDailyCard.tsx'
                   ':(exclude)src/components/dashboard/student/StudentAssignedTasksPage.tsx'
                   ':(exclude)src/components/dashboard/student/VoiceExplainModal.tsx'
                   ':(exclude)src/components/dashboard/student/TaskVoicePanel.tsx'
                   ':(exclude)src/components/dashboard/college/TpoStudentProfile.tsx'
                   ':(exclude)src/components/dashboard/student/StudentSquadPage.tsx'
                   ':(exclude)src/components/dashboard/student/StudentSeasonReport.tsx'
                   ':(exclude)src/components/dashboard/season/SeasonLeaderboards.tsx'
                   ':(exclude)src/components/dashboard/student/SimpleQuestion.tsx'
                   ':(exclude)src/lib/voiceGateReload.test.ts')
          git diff --stat 74c3a127773e5d6fbd66498191185095de9562d9 -- src index.html public "${ALLOWED[@]}"
          git diff --quiet 74c3a127773e5d6fbd66498191185095de9562d9 -- src index.html public "${ALLOWED[@]}" \
            || { echo "::error::a frontend file changed: the S39 architecture freeze forbids it"; exit 1; }

      - name: UI freeze - the college controls by name
        run: node --test scripts/dev-tools/sidhu_s39_ui_contract.test.mjs

      - name: Install PGlite and pg (pinned; not repository dependencies)
        run: npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/t" @electric-sql/pglite@0.2.17 pg@8.13.1

      - name: Migrations 105-109 on PostgreSQL 16 (PGlite)
        env:
          PGLITE_MODULE: file://${{ runner.temp }}/t/node_modules/@electric-sql/pglite/dist/index.js
        run: |
          node --test --test-reporter=tap \
            scripts/dev-tools/sidhu_s39_squads.test.mjs \
            scripts/dev-tools/s34_migration_105.test.mjs \
            scripts/dev-tools/sidhu_s34_remove_students.test.mjs \
            scripts/dev-tools/sidhu_s36_security.test.mjs | tee "$RUNNER_TEMP/pglite.tap"
          grep -q '^# fail 0$' "$RUNNER_TEMP/pglite.tap"
          grep -q '^# skipped 0$' "$RUNNER_TEMP/pglite.tap" || { echo "::error::tests were skipped: PGlite did not load"; exit 1; }

      - name: Concurrency on a real PostgreSQL 16 server (several sessions)
        timeout-minutes: 5
        env:
          PG_URL: postgres://postgres:postgres@localhost:5432/postgres
          PG_MODULE: file://${{ runner.temp }}/t/node_modules/pg/lib/index.js
        run: |
          node --test --test-reporter=tap scripts/dev-tools/sidhu_s39_squads_concurrency.test.mjs | tee "$RUNNER_TEMP/pg.tap"
          grep -q '^# fail 0$' "$RUNNER_TEMP/pg.tap"
          grep -q '^# skipped 0$' "$RUNNER_TEMP/pg.tap" || { echo "::error::concurrency tests were skipped: no server"; exit 1; }

      - name: The migrations apply on the real server as one file each, twice (what gcloud sql import does)
        env:
          PGPASSWORD: postgres
        run: |
          node -e 'import("./scripts/dev-tools/sidhu_s39_squad_fixture.mjs").then(m => process.stdout.write(m.FIXTURE))' > "$RUNNER_TEMP/fixture.sql"
          psql -h localhost -U postgres -c 'create database s39_files'
          psql -h localhost -U postgres -d s39_files -v ON_ERROR_STOP=1 -q -f "$RUNNER_TEMP/fixture.sql"
          for f in migration/108-squad-vacancies-fill-safely.sql migration/109-default-squad-name-themes.sql \
                   migration/108-squad-vacancies-fill-safely.sql migration/109-default-squad-name-themes.sql \
                   migration/108-rollback-squad-vacancies-fill-safely.sql migration/108-squad-vacancies-fill-safely.sql; do
            echo "== $f"; psql -h localhost -U postgres -d s39_files -v ON_ERROR_STOP=1 -q -f "$f"
          done
