name: Deploy to production

# Publishes the site to Firebase Hosting, in the same Google project as the
# database, the API, the file service and the 40 functions. It replaces a
# workflow that promoted a build on Vercel - which is why, for a while after the
# move, every push kept refreshing the old site while the new one sat still.
#
# No key file. GitHub proves who it is with a short-lived OIDC token, Google
# accepts it only from this repository, and hands back a credential that expires
# in minutes. There is no secret to leak and none to rotate. The one thing that
# would grant standing access to the project - a downloaded service-account key -
# deliberately does not exist.
#
# The account it acts as may publish to Hosting and do nothing else.

# Every push (any branch) and pull request runs the release gate. Only a push to
# main that passes the gate publishes; a failing test means no deploy.
on:
  push:
  pull_request:
  # Lets you re-run a deploy from the Actions tab without pushing anything.
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run pointless, so cancel it
# rather than racing two publishes at the same site.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write        # required to request the OIDC token

jobs:
  # Release gate. Must pass before anything is published.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: No secrets in tracked files
        run: python3 scripts/secret_scan.py

      - name: Retired architecture has not come back
        run: python3 scripts/legacy_guard.py

      - name: Migrations are consistent (numbering, self-check, mirror copy, rollback)
        run: python3 scripts/migrations.py check

      - uses: actions/setup-node@v4
        with:
          node-version: '22'     # the unit tests are .ts files run by node --test
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install
        run: npm ci

      - name: Frontend unit tests
        run: node --experimental-strip-types --test src/lib/*.test.ts

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Server function tests (Deno)
        run: deno test --no-lock --allow-env --allow-import --allow-read supabase/functions/_shared/ supabase/functions/transcription-reap/

      - name: Auth bridge tests (signer, service callers, refusals)
        run: PGRST_JWT_SECRET=ci-only-not-a-real-secret-0123456789 deno test --no-lock --allow-env --allow-net auth-bridge/

      - name: Token module copies are identical
        run: |
          cmp supabase/functions/_shared/appToken.ts files-service/appToken.ts
          cmp accounts/apptoken.py transcription-worker/apptoken.py
          cmp accounts/apptoken.py transcriber/apptoken.py

      - name: Files service tests
        run: PGRST_JWT_SECRET=ci-only-not-a-real-secret deno test --no-lock --allow-env --allow-net --allow-read --allow-write files-service/

      - name: Type-check every active server function (Deno)
        run: deno check --no-lock functions-service/main.ts supabase/functions/*/index.ts

      - name: Accounts sync safety tests (Python)
        run: |
          pip install --quiet cryptography
          cd accounts && python3 test_sync_plan.py && python3 test_apptoken.py
          cd ../transcription-worker && python3 -m unittest test_server
          cd ../transcriber && python3 test_language_gate.py

      - name: Production build
        run: npm run build

      # Build once: this exact folder is what the deploy job publishes. The deploy
      # job never builds, so what was tested is what ships.
      - name: Record the build
        run: (cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum) > dist.sha256 && sha256sum dist.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: |
            dist
            dist.sha256
          retention-days: 14
          if-no-files-found: error

  # The code runner image, built and attacked locally: all 8 languages, timeouts,
  # output caps, leftover processes (F8), memory, internet and metadata (F9).
  # SYS_ADMIN lets the container create per-run network namespaces, exactly as
  # Cloud Run does; REQUIRE_NET_ISOLATION makes that mandatory.
  code-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build runner image
        run: docker build -t prooflab-runner code-runner
      - name: Start runner
        run: |
          docker run -d --name runner -p 8080:8080 -e RUNNER_SECRET=ci-secret \
            --cap-add SYS_ADMIN --security-opt seccomp=unconfined --memory 2g prooflab-runner
          for i in $(seq 1 30); do curl -sf http://localhost:8080/ready && break; sleep 1; done
      - name: Runner tests
        run: RUNNER_URL=http://localhost:8080 RUNNER_SECRET=ci-secret REQUIRE_NET_ISOLATION=1 python3 code-runner/test_runner.py
      - name: Runner logs on failure
        if: failure()
        run: docker logs runner | tail -50

  # Proves the build-once hand-off on EVERY branch, without publishing anything: a separate
  # job (a fresh machine) downloads the artifact the gate built, checks every file against
  # the recorded checksums, and checks the site is complete. The deploy job below does the
  # same download and check before it publishes - so that path is no longer first exercised
  # on a production deploy.
  artifact-handoff:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-${{ github.sha }}

      - name: Same files as the gate built
        run: |
          (cd dist && sha256sum --quiet -c ../dist.sha256)
          echo "files verified $(wc -l < dist.sha256)"
          sha256sum dist.sha256

      - name: The site is complete (smoke check, nothing is deployed)
        run: |
          test -s dist/index.html
          entry=$(grep -oE '<script type="module"[^>]*src="/assets/[^"]+\.js"' dist/index.html | grep -oE 'assets/[^"]+\.js' | head -1)
          test -n "$entry" && test -s "dist/$entry" && echo "entry script present: $entry"
          # Every asset the page links to exists in the artifact.
          for f in $(grep -oE '(src|href)="/assets/[^"]+"' dist/index.html | grep -oE 'assets/[^"]+'); do test -s "dist/$f" || { echo "missing $f"; exit 1; }; done
          # The build talks to production addresses, never staging ones.
          if grep -rl "prooflab-staging-" dist/assets >/dev/null; then echo "staging address found in the production build"; exit 1; fi
          echo "HAND-OFF OK - not deployed"

  deploy:
    needs: [test, code-runner, artifact-handoff]
    # Publishing only ever happens from main (or a manual run of main), never from
    # another branch or a pull request.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: prooflab-508214
          workload_identity_provider: projects/135298577404/locations/global/workloadIdentityPools/github/providers/prooflaab
          service_account: github-deploy@prooflab-508214.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # The build made and tested by the gate above - not a second build.
      - uses: actions/download-artifact@v4
        with:
          name: site-${{ github.sha }}

      - name: Verify it is the tested build
        run: (cd dist && sha256sum --quiet -c ../dist.sha256) && sha256sum dist.sha256

      - name: Publish
        run: python scripts/deploy-hosting.py

      - name: Confirm the site is serving the new build
        run: |
          # A publish can report success while the edge still serves the previous
          # version, so check the bundle name actually moved rather than trusting
          # the API's word for it.
          # The entry is the <script type="module" src=...> in index.html. Other
          # chunks can also be named index-*.js, so never pick one by filename.
          entry() { grep -oE '<script type="module"[^>]*src="/assets/[^"]+\.js"' | grep -oE 'assets/[^"]+\.js' | head -1; }
          built=$(entry < dist/index.html)
          echo "expecting: $built"
          for i in $(seq 1 20); do
            live=$(curl -s -H 'Cache-Control: no-cache' https://prooflab.co.in/ | entry || true)
            if [ -n "$built" ] && [ "$live" = "$built" ]; then
              echo "live and serving $live"
              exit 0
            fi
            sleep 6
          done
          echo "::warning::prooflab.co.in is still serving $live, not $built. It may catch up shortly."
