            || { echo "::error::a frontend file changed: the S39 architecture freeze forbids it"; exit 1; }

      - name: UI re-freeze 30 Oct - graded marks, Assign by section, saved answers, work visibility, go-live batch - screens equal commit f51c9c2
        # Owner opened these for graded daily marks (29 Oct 2026) and asked for them to be frozen again once done.
        # 30 Oct 2026: owner OK'd TpoSquads.tsx for MF-011 (Assign by section), frozen again here.
        # 30 Oct 2026: owner OK'd SandboxTaskPanel / WrittenTaskPanel for MF-020 (saved answer on a finished task).
        # 30 Oct 2026: owner OK'd the college student page, Privacy, Portfolio, Settings and the voice sentence for MF-023.
        # 30 Oct 2026: owner OK'd the go-live batch (MF-114/115/045/046/051/116/029/059/107, fix_all_prompt.md).
